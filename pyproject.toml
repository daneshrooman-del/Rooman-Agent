[project]
name = "trackb"
version = "0.1.0"
description = "Track B: Live Conversation & Agent Builder"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langgraph>=0.2",
    "qdrant-client>=1.10",
    "sentence-transformers>=3.0",
    "faster-whisper>=1.0",
    "piper-tts>=1.8",
    "google-genai>=1.0",
    "httpx>=0.27",
    "livekit-agents>=0.10",
    "redis>=5.0",
    "sqlmodel>=0.0.21",
    "tenacity>=8.5",
    "pypdf>=4.0",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
