<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400..700&family=Plus+Jakarta+Sans:wght@600..800&family=JetBrains+Mono:wght@500..700&display=swap" rel="stylesheet" />
    <script>
      // Set the theme before first paint: stored choice, else light (the default).
      (function () {
        var t = null
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = 'light' // light by default; users can switch to dark
        document.documentElement.dataset.theme = t
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0C1433')
        else document.querySelector('meta[name="theme-color"]').setAttribute('content', '#FFFFFF')
      })()
    </script>
    <meta name="description" content="Rooman Agent — create one AI digital identity and use it across videos, live conversations, and autonomous AI agents." />
    <title>Rooman Agent — AI Avatars, Video & Agents</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
